[package]
name = "syson-web"
version = "0.1.0"
edition = "2024"
license = "EPL-2.0"
description = "Bounded Rust/WASM SysON model authoring interface"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
syson-node-measurement = { path = "../syson-node-measurement" }
syson-layout = { path = "../syson-layout" }
syson-routing = { path = "../syson-routing" }
syson-model = { path = "../syson-model" }
syson-metamodel = { path = "../syson-metamodel" }
syson-editor = { path = "../syson-editor" }
serde_json = "=1.0.151"
syson-workflow = { path = "../syson-workflow", optional = true }

[features]
raw-factory-candidate = ["dep:syson-workflow", "syson-workflow/raw-factory-candidate"]

[workspace]
