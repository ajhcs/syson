name: Contribution proposal
description: Suggest a small change or ask for help finding one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing. This issue will be public. Do not include credentials, private models, or security vulnerability details.
        For an existing issue, request the task in its comments instead of opening a duplicate.
        Before changing files, have a maintainer confirm the scope; see the [contributor guide](https://github.com/ajhcs/syson/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to work on?
      description: Describe the problem and the outcome you would like. It is fine to ask for a small starting point.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What scope do you have in mind?
      description: Share a first step, affected component, or issue. A maintainer can help narrow it.
  - type: textarea
    id: evidence
    attributes:
      label: Source, examples, or checks
      description: If known, link relevant code, issues, or shareable fixtures. Include any commands, results, and relevant toolchain versions you have tried.
  - type: textarea
    id: help
    attributes:
      label: Would you like guidance?
      description: Ask about any part of the task or mention @ajhcs if you would like mentoring. No prior project expertise is required.
